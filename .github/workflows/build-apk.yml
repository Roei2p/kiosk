name: Build Debug APK

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate standard Android debug keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and rename APK
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$APK_PATH" dist/kiosk-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-debug-apk
          path: dist/kiosk-debug.apk

      - name: Publish/refresh GitHub Release with latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "Latest Debug Build"
          body: |
            Automatically built debug APK from commit ${{ github.sha }} on branch `${{ github.ref_name }}`.
            This is an unsigned-for-distribution debug build intended for internal testing only.
          prerelease: true
          make_latest: true
          files: dist/kiosk-debug.apk

      - name: Prepare GitHub Pages download page
        run: |
          mkdir -p public
          cp dist/kiosk-debug.apk public/kiosk-debug.apk
          cat > public/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="he" dir="rtl">
          <head>
            <meta charset="UTF-8" />
            <title>רשם ציוד רפואי - Kiosk</title>
          </head>
          <body>
            <h1>רשם ציוד רפואי - Kiosk (Debug APK)</h1>
            <p>גרסת בדיקה אוטומטית, מעודכנת מהקומיט האחרון בענף.</p>
            <p><a href="./kiosk-debug.apk">הורד את קובץ ה-APK</a></p>
          </body>
          </html>
          HTML

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: false
